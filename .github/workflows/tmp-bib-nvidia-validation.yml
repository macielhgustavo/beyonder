name: temporary-bib-nvidia-validation

on:
  push:
    branches:
      - fix/bib-cleanup-nvidia-smoke

permissions:
  contents: read

jobs:
  validate-node24-bib-and-nvidia:
    runs-on: ubuntu-24.04
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Full test suite
        run: pnpm test
      - name: BIB lifecycle smoke must exit zero after benchmark.completed
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/beyonder-bib-lifecycle.sqlite*
          cat >/tmp/bib-lifecycle-smoke.ts <<'TS'
          import { runBenchmark } from "./packages/benchmark/src/runner/index.ts";
          import { BenchmarkStore } from "./packages/benchmark/src/persistence/store.ts";

          let completed = false;
          const results = await runBenchmark({
            mode: "smoke",
            targets: [{
              provider: "lifecycle-smoke",
              providerName: "Lifecycle Smoke",
              model: "mock-instruct",
              baseUrl: "http://127.0.0.1"
            }],
            client: {
              async complete(target) {
                return {
                  content: "",
                  provider: target.provider,
                  model: target.model,
                  estimatedCostUsd: 0
                };
              }
            },
            telemetry: {
              async emit(event) {
                if (event === "benchmark.completed") {
                  completed = true;
                  console.log("benchmark.completed");
                }
              }
            }
          });

          if (!completed || results.length === 0) process.exit(3);
          const path = "/tmp/beyonder-bib-lifecycle.sqlite";
          const store = new BenchmarkStore(path);
          store.saveResults(results);
          store.close();
          store.close();
          const reopened = new BenchmarkStore(path);
          if (reopened.listResults().length !== results.length) process.exit(4);
          reopened.close();
          reopened.close();
          TS
          set +e
          pnpm exec tsx /tmp/bib-lifecycle-smoke.ts
          code=$?
          set -e
          echo "BIB_EXIT_CODE=$code"
          test "$code" -eq 0
      - name: Real NVIDIA NIM catalog-driven smoke
        id: nvidia
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_NIM_API_KEY:-}" ]; then
            echo "NVIDIA_SMOKE_BLOCKED=MISSING_NVIDIA_NIM_API_KEY"
            exit 2
          fi
          NVIDIA_NIM_SMOKE_MAX_CANDIDATES=20 pnpm -s providers:nvidia-smoke
      - name: Record NVIDIA smoke availability
        shell: bash
        run: |
          echo "NVIDIA_STEP_OUTCOME=${{ steps.nvidia.outcome }}"
