name: validate-web-evals

on:
  push:
    branches:
      - feat/web-evals

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @beyonder/browser-agent exec playwright install chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Test web evals
        run: pnpm test:web-evals
      - name: Web evals smoke
        run: pnpm web:evals:smoke
